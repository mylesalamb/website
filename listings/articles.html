---
{
    "name": "Articles",
    "template": "base.html"
}
---

<h3>Articles</h3>



{% for metadata,article in ctx.get_artifact_by_metadata("type", "article") | sort(attribute='0.date', reverse=true) %}
<div class="article">
    <a href="{{ article.url }}"> {{ metadata.name }}</a>
    <div class="description">{{metadata.description}}</div>
</div>
{% endfor %}
